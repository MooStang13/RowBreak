<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rowbreak is a brick breaker for the browser: a branching 21-level unlock tree, bonus levels, hardcore mode, power-ups, a coin shop and online 1v1.">
<meta name="theme-color" content="#0c1018">
<meta property="og:title" content="Rowbreak">
<meta property="og:description" content="Rowbreak is a brick breaker for the browser: a branching 21-level unlock tree, bonus levels, hardcore mode, power-ups, a coin shop and online 1v1.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c1018'/%3E%3Crect x='4' y='6' width='11' height='6' rx='1.5' fill='%23ffb3ba'/%3E%3Crect x='17' y='6' width='11' height='6' rx='1.5' fill='%23baffc9'/%3E%3Crect x='4' y='14' width='11' height='6' rx='1.5' fill='%23bae1ff'/%3E%3Crect x='17' y='14' width='11' height='6' rx='1.5' fill='%23d9c2ff'/%3E%3Crect x='10' y='25' width='12' height='3' rx='1.5' fill='%23e6ebf5'/%3E%3C/svg%3E">
<style>
html { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: dark; }
body { margin: 0; font-size: 14px; }
</style>
<title>Rowbreak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one centred playfield sized to the viewport, key hints underneath. Single committed dark look (arcade cabinet) with pastel bricks, by choice. */
:root {
  --bg: #0c1018;
  --panel: #131a26;
  --line: #243046;
  --fg: #e6ebf5;
  --dim: #7f8ca6;
  --accent: #ffe28a;
  --font-display: "Silkscreen", "Courier New", monospace;
  --font-body: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  padding-inline: 16px;
  padding-block: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
#frame {
  position: relative;
  width: min(100%, calc((100dvh - 64px) * 0.8));
  min-width: 0;
}
#codeIn {
  position: absolute;
  left: 50%;
  top: 28.3%;
  transform: translate(-50%, -50%);
  width: 46%;
  box-sizing: border-box;
  padding: 0.25em 0.2em;
  text-align: center;
  text-indent: 0.35em;
  text-transform: uppercase;
  letter-spacing: 0.35em;
  font-family: var(--font-display);
  font-weight: 700;
  background: var(--panel);
  color: var(--accent);
  border: 2px solid var(--line);
  border-radius: 8px;
  outline: none;
  -webkit-user-select: text;
  user-select: text;
  touch-action: auto;
}
#codeIn:focus { border-color: var(--accent); }
#manual {
  position: absolute; inset: 0; box-sizing: border-box; padding: 4.5% 5%;
  background: var(--bg); border: 2px solid var(--line); border-radius: 4px;
  display: none; flex-direction: column; gap: 1.6%; overflow: auto;
  font-family: var(--font-body); font-size: clamp(10px, 2.5vw, 13px); line-height: 1.45; color: var(--fg);
  -webkit-user-select: text; user-select: text; touch-action: auto;
}
#manual h2 { margin: 0 0 4px; font: 700 clamp(14px, 3.8vw, 20px) var(--font-display); color: #aed6ff; text-align: center; }
#manual p { margin: 0; color: var(--dim); }
#manual b { color: var(--fg); font-weight: 500; }
#manual textarea {
  width: 100%; box-sizing: border-box; min-height: 5.2em; resize: none; padding: 8px;
  background: var(--panel); color: var(--fg); border: 2px solid var(--line); border-radius: 8px;
  font: 11px/1.3 var(--font-body); word-break: break-all; outline: none;
}
#manual textarea:focus { border-color: var(--accent); }
#manual .row { display: flex; gap: 8px; }
#manual button {
  flex: 1; padding: 10px 6px; cursor: pointer; background: var(--panel); color: var(--fg);
  border: 2px solid var(--line); border-radius: 8px; font: 700 clamp(10px, 2.6vw, 12px) var(--font-display);
}
#manual button.pri { background: #aed6ff; color: #0c1018; border-color: #aed6ff; }
#manual .stat { min-height: 1.4em; color: var(--accent); text-align: center; }
#manual .bad { color: #ffb3ba; }
canvas {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 5;
  max-width: 100%;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 4px;
  outline: none;
}
canvas:focus-visible { border-color: var(--accent); }
.hints {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--dim);
  text-align: center;
  line-height: 1.6;
}
.hints kbd {
  font-family: var(--font-body);
  font-size: 10px;
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 1px 5px;
}
</style>

</head>
<body>
<div id="frame">
  <canvas id="game" width="480" height="600" tabindex="0" aria-label="Rowbreak, a brick breaker game. Move the paddle with A and D or the left and right arrow keys, or drag on a touch screen."></canvas>
  <div id="manual" role="dialog" aria-label="Direct link">
    <h2>DIRECT LINK</h2>
    <div id="mChoose">
      <p>Plays straight between the two browsers with no relay in the middle. You swap two codes yourself, by text message or chat, once per match.</p>
      <div class="row" style="margin-top:14px"><button class="pri" id="mHost">I'M HOSTING</button><button id="mJoin">I'M JOINING</button></div>
    </div>
    <div id="mFlow" style="display:none">
      <p id="mHelp"></p>
      <p id="mLab1" style="margin-top:10px"></p>
      <textarea id="mOut" readonly></textarea>
      <div class="row"><button id="mCopy">COPY CODE</button></div>
      <p id="mLab2" style="margin-top:10px"></p>
      <textarea id="mIn" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"></textarea>
      <div class="row"><button class="pri" id="mGo"></button></div>
    </div>
    <div class="stat" id="mStat"></div>
    <div class="row" style="margin-top:auto"><button id="mCancel">BACK</button></div>
  </div>
  <input id="codeIn" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Game code" style="display:none">
</div>
<p class="hints"><kbd>A</kbd> <kbd>D</kbd> or <kbd>←</kbd> <kbd>→</kbd> move &nbsp;·&nbsp; <kbd>Space</kbd> launch &nbsp;·&nbsp; <kbd>P</kbd> pause &nbsp;·&nbsp; <kbd>M</kbd> level tree &nbsp;·&nbsp; drag or tap on touch</p>

  // ---------- online 1v1 ----------
  // One shared arena, 480 wide and VS_H tall. The host sits at the bottom, the guest at the top.
  // Each player sees themselves at the bottom: the guest's view is flipped top to bottom, and the
  // opponent's half is squashed into a strip under the scoreboard.
  var VS_H = 760, VS_CY = 380, VS_SQ = 320, VS_K = 0.28, VS_MAXR = 8, VS_ROWS0 = 5, VS_PW = 84, VS_PY = 30;
  var VS_SQB = 52 + VS_SQ * VS_K;
  var CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var MINE = '#baffc9', THEIRS = '#ffb3ba';
  var vs = null, vsMsg = '', vsLeaveArm = 0, codeShown = false, vsSel = 0;
  var codeEl = document.getElementById('codeIn');
  var manEl = document.getElementById('manual');

  function r1(v) { return Math.round(v * 10) / 10; }
  function vsPadY(p) { return p === 0 ? VS_H - VS_PY : VS_PY; }
  function vsWall() { var w = []; for (var r = 0; r < VS_MAXR; r++) w.push(r < VS_ROWS0 ? 1023 : 0); return w; }
  function vsBall(p) {
    return { x: W / 2, y: vsPadY(p) + (p === 0 ? -13 : 13), vx: 0, vy: 0, r: 7, stuck: true, stuckT: 0 };
  }
  function vsNewSession(role, code) {
    return {
      role: role, code: code, me: role === 'host' ? 0 : 1, peer: null, conn: null, timer: null,
      phase: 'wait', started: false, ready: false, left: false,
      pad: [{ x: W / 2 }, { x: W / 2 }], ball: [vsBall(0), vsBall(1)], wall: [vsWall(), vsWall()],
      lives: [3, 3], cd: 3, t: 0, over: null, rematch: [false, false],
      events: [], netEvents: [], parts: [], launchReq: [false, false],
      inX: W / 2, sendTimer: 0, seq: 0, snapAt: 0, copied: 0, pendingLaunch: false, myRm: false
    };
  }
  function vsSpeed() { return Math.min(620, 330 + vs.t * 3.4); }

  function vsReset() {
    vs.wall = [vsWall(), vsWall()]; vs.lives = [3, 3]; vs.ball = [vsBall(0), vsBall(1)];
    vs.cd = 3.4; vs.t = 0; vs.over = null; vs.rematch = [false, false]; vs.phase = 'countdown';
    vs.parts = []; vs.events = []; vs.launchReq = [false, false];
  }

  function vsFixAngle(b) {
    var sp = Math.hypot(b.vx, b.vy);
    if (sp < 1) return;

    (function open() {
      var code = '';
      for (var i = 0; i < 4; i++) code += CODE_CHARS.charAt(Math.floor(Math.random() * CODE_CHARS.length));
      var sess = vsNewSession('host', code);
      vs = sess;
      var peer;
      try { peer = new Peer('rowbreak-' + code, VS_ICE); } catch (e) { vsFail('COULD NOT START ONLINE PLAY'); return; }
      sess.peer = peer;
      sess.timer = setTimeout(function () { if (vs === sess && !sess.ready) vsFail('COULD NOT REACH THE RELAY. TRY AGAIN'); }, 15000);
      peer.on('open', function () { if (vs === sess) sess.ready = true; });
      peer.on('error', function (err) {
        if (vs !== sess) return;
        if (err && err.type === 'unavailable-id' && tries++ < 6) { vsCleanup(); open(); return; }
        vsFail('RELAY ERROR (' + ((err && err.type) || 'unknown') + ')');
      });
      peer.on('connection', function (conn) {
        if (vs !== sess || sess.conn) {
          var turnAway = function () {
            try { conn.send({ t: 'full' }); } catch (e) {}
            setTimeout(function () { try { conn.close(); } catch (e) {} }, 300);
          };
          if (conn.open) turnAway(); else conn.on('open', turnAway);
          return;
        }
        sess.conn = conn; sess.stage = 'FRIEND FOUND, LINKING';
        vsHook(conn, sess); vsWatchIce(conn, sess);
      });
      peer.on('disconnected', function () { try { if (vs === sess && !peer.destroyed) peer.reconnect(); } catch (e) {} });
    })();
  }

  function vsOpenJoin() {
    if (typeof Peer === 'undefined') { vsMsg = NO_PEER; return; }
    vsCleanup(); vsMsg = ''; state = 'vsjoin'; hoverId = null;
    try { codeEl.value = ''; } catch (e) {}
    setCodeBox(true);
  }
  function vsJoin(raw) {
    var code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (typeof Peer === 'undefined') { vsMsg = NO_PEER; return; }
    if (code.length !== 4) { vsMsg = 'THE CODE HAS 4 CHARACTERS'; return; }
    vsCleanup();
    var sess = vsNewSession('guest', code);
    vs = sess; sess.phase = 'connecting'; vsMsg = ''; state = 'vsjoin';
    var peer;
    try { peer = new Peer(undefined, VS_ICE); } catch (e) { vsFail('COULD NOT START ONLINE PLAY'); return; }
    sess.peer = peer;
    sess.timer = setTimeout(function () { if (vs === sess && !sess.started) vsFail(sess.stage ? 'NO LINK AFTER 30 S (' + sess.stage + ')' : 'COULD NOT REACH THE RELAY. TRY AGAIN'); }, 30000);
    peer.on('open', function () {
      if (vs !== sess) return;
      sess.stage = 'RELAY OK, CALLING HOST';
      var conn = peer.connect('rowbreak-' + code, { reliable: true, serialization: 'json' });
      sess.conn = conn;
      vsHook(conn, sess); vsWatchIce(conn, sess);
    });
    peer.on('error', function (err) {
      if (vs !== sess) return;
      vsFail(err && err.type === 'peer-unavailable' ? 'NO GAME WITH THAT CODE' : 'CONNECTION ERROR (' + ((err && err.type) || 'unknown') + ')');
    });
  }

  function vsCopy() {
    if (!vs) return;
    var link = location.href.split('#')[0] + '#' + vs.code;
    var sess = vs;
    try {
      navigator.clipboard.writeText(link).then(function () { sess.copied = tAnim + 2; }, function () { vsMsg = link; });
    } catch (e) { vsMsg = link; }
  }

  function vsAction() {
    if (!vs || vs.phase === 'over') return;
    if (vs.role === 'host') vs.launchReq[0] = true; else vs.pendingLaunch = true;
  }
  function vsRematch() {
    if (!vs || vs.phase !== 'over') return;
    if (vs.role === 'host') vs.rematch[0] = true; else { vs.myRm = true; vs.rematch[1] = true; }
  }

  function vsMovePad(dt) {
    var pd = vs.pad[vs.me];
    var dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir !== 0) { pointerX = null; pd.x += dir * 560 * dt; }
    else if (pointerX !== null) { var d = pointerX - pd.x, lim = 1200 * dt; pd.x += Math.max(-lim, Math.min(lim, d)); }
    pd.x = Math.max(VS_PW / 2, Math.min(W - VS_PW / 2, pd.x));
  }

  function vsUpdate(dt) {
    if (!vs || state !== 'vsgame') return;
    vsMovePad(dt);
    vs.sendTimer += dt;
    if (vs.role === 'host') {
      if (vs.ai) vsAI(dt);
      if (vs.phase !== 'over') vsSim(dt);
      else if (vs.events.length) { vs.netEvents = vs.netEvents.concat(vs.events); vsFx(vs.events); vs.events = []; }
      if (vs.phase === 'over' && vs.rematch[0] && vs.rematch[1] && vs.over && vs.over.why !== 'LEFT') vsReset();
      if (vs.sendTimer >= 1 / 30) { vs.sendTimer = 0; vsSend(vsSnapshot()); }
    } else if (vs.sendTimer >= 1 / 30) {
      vs.sendTimer = 0;
      var msg = { t: 'i', x: r1(vs.pad[1].x) };
      if (vs.pendingLaunch) { msg.l = 1; vs.pendingLaunch = false; }
      if (vs.myRm) msg.r = 1;
      vsSend(msg);
    }
    for (var k = vs.parts.length - 1; k >= 0; k--) {
      var q = vs.parts[k];
      q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.t > q.life) vs.parts.splice(k, 1);
    }
  }

  // ---------- online 1v1 screens ----------
  function drawVsMenu() {
    gridBg(0);
    text('1V1', W / 2, 40, 22, C.blue, 'center');
    var lines = [
      'TWO PLAYERS, ONE ARENA, FIVE ROWS OF BRICKS EACH.',
      'YOUR BRICKS ARE GREEN. THEIRS ARE PINK.',
      'BREAK YOUR OWN BRICKS AND THEY GET A BLOCK ADDED.',
      'CARVE A GAP AND YOUR BALL BREAKS THROUGH THEIR WALL.',
      'DROP YOUR OWN BALL AND YOU LOSE A LIFE. YOU HAVE 3.',
      'THEIR BALL GETS PAST YOU AND YOU LOSE STRAIGHT AWAY.'
    ];
    for (var i = 0; i < lines.length; i++) text(lines[i], W / 2, 92 + i * 22, 11, i === 1 ? C.fg : C.dim, 'center', 'body');
    var ys = [276, 322, 368, 414, 460];
    btn('v0', 'VS COMPUTER', W / 2, ys[0], 260, 38, true, vsStartAI, C.blue);
    btn('v1', 'ONLINE: CREATE GAME', W / 2, ys[1], 260, 38, false, vsHostStart);
    btn('v2', 'ONLINE: JOIN WITH CODE', W / 2, ys[2], 260, 38, false, vsOpenJoin);
    btn('v3', 'DIRECT LINK (NO RELAY)', W / 2, ys[3], 260, 38, false, manOpen);
    btn('v4', 'BACK', W / 2, ys[4], 260, 38, false, toMenu);
    if (vsMsg) text(vsMsg, W / 2, 510, 10, C.bad, 'center', 'body');
    text('ONLINE PLAY IS EXPERIMENTAL AND MAY NOT WORK ON EVERY NETWORK', W / 2, 560, 9, C.dim, 'center', 'body');
    ctx.strokeStyle = C.fg; ctx.lineWidth = 2;
    rr(W / 2 - 136, ys[vsSel] - 22, 272, 44, 8); ctx.stroke();
  }

  function drawVsLobby() {
    gridBg(0);
    var host = state === 'vshost', dots = '...'.slice(0, 1 + Math.floor(tAnim * 2) % 3);
    text(host ? 'YOUR GAME CODE' : 'JOIN A GAME', W / 2, 56, 16, C.blue, 'center');
    if (host) {
      if (vs) {
        text(vs.code, W / 2, 170, 64, C.accent, 'center');
        text(vs.stage ? vs.stage + dots : vs.ready ? 'WAITING FOR A PLAYER' + dots : 'OPENING' + dots, W / 2, 240, 12, C.fg, 'center');
        btn('copy', tAnim < vs.copied ? 'LINK COPIED' : 'COPY INVITE LINK', W / 2, 350, 280, 42, true, vsCopy, C.blue);
      }
      text('SEND THE CODE OR THE LINK TO A FRIEND', W / 2, 282, 10, C.dim, 'center', 'body');
      text('THEY PRESS ONLINE 1V1, THEN JOIN WITH CODE', W / 2, 300, 10, C.dim, 'center', 'body');
      btn('cancel', 'CANCEL', W / 2, 404, 280, 42, false, vsOpenMenu);
    } else {
      var busy = vs && vs.phase === 'connecting';
      text(busy ? 'CONNECTING' + dots : 'TYPE THE 4 CHARACTER CODE', W / 2, 112, 11, C.fg, 'center');
      if (busy && vs.stage) text(vs.stage, W / 2, 140, 10, C.dim, 'center', 'body');
      btn('join', 'JOIN', W / 2, 262, 280, 42, true, function () { vsJoin(codeEl.value); }, C.blue);
      btn('back', 'BACK', W / 2, 316, 280, 42, false, vsOpenMenu);
    }
    if (vsMsg) text(vsMsg, W / 2, 470, 10, C.bad, 'center', 'body');
  }

  function drawHearts(n, x, y, dir) {
    for (var l = 0; l < n; l++) {
      ctx.fillStyle = C.fg;
      ctx.beginPath(); ctx.arc(x + dir * l * 16, y, 5, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawVs() {
    var me = vs.me, op = 1 - me, i, k;
    function vyF(y) { return me === 0 ? y : VS_H - y; }
    function sy(yv) { return yv < VS_SQ ? 52 + yv * VS_K : VS_SQB + (yv - VS_SQ); }
    function SY(y) { return sy(vyF(y)); }

    drawBgTexture(save.equipped.bg, 0, 0, W, H, tAnim);
    ctx.fillStyle = 'rgba(12,16,24,0.5)'; ctx.fillRect(0, 52, W, VS_SQB - 52);
    ctx.fillStyle = C.line; ctx.fillRect(0, VS_SQB - 1, W, 1);

    ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, 52);
    ctx.fillStyle = C.line; ctx.fillRect(0, 50, W, 2);
    text('YOU', 14, 16, 10, MINE);
    drawHearts(vs.lives[me], 19, 35, 1);
    text('OPP', W - 14, 16, 10, THEIRS, 'right');
    drawHearts(vs.lives[op], W - 19, 35, -1);
    text(fmt(vs.t), W / 2, 26, 16, C.fg, 'center');

    // walls
    for (var q = 0; q < 2; q++) {
      var col = q === me ? MINE : THEIRS;
      for (var r = 0; r < VS_MAXR; r++) {
        var m = vs.wall[q][r];
        if (!m) continue;
        var ry = q === 0 ? VS_CY + r * 16 + 1 : VS_CY - r * 16 - 15;
        var s1 = SY(ry), s2 = SY(ry + 14), top = Math.min(s1, s2), hh = Math.max(2, Math.abs(s2 - s1));
        for (var c = 0; c < 10; c++) {
          if (!(m & (1 << c))) continue;
          var rx = BX0 + c * (BW + GAP);
          ctx.fillStyle = col;
          if (hh > 8) { rr(rx, top, BW, hh, 3); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(rx + 3, top + 2, BW - 6, 3); }
          else ctx.fillRect(rx, top, BW, hh);
        }
      }
    }

    // paddles
    var myY = SY(vsPadY(me)), opY = SY(vsPadY(op));
    drawPaddleSkin(save.equipped.paddle, vs.pad[me].x - VS_PW / 2, myY - 6, VS_PW, 12, tAnim);
    ctx.fillStyle = THEIRS; rr(vs.pad[op].x - VS_PW / 2, opY - 2, VS_PW, 4, 2); ctx.fill();

    // balls
    for (i = 0; i < 2; i++) {
      var b = vs.ball[i], bx = b.x, by = b.y;
      if (vs.role === 'guest' && !b.stuck && vs.snapAt) {
        var el = Math.min(0.1, (performance.now() - vs.snapAt) / 1000);
        bx = Math.max(7, Math.min(W - 7, bx + b.vx * el)); by += b.vy * el;
      }
      if (b.stuck && i === me) bx = vs.pad[me].x;
      var squashed = vyF(by) < VS_SQ, rad = squashed ? 4 : 7, sx = bx, sY = SY(by);
      if (i === me) {
        var skin = save.equipped.ball;
        drawBall(skin === 'comet' ? 'classic' : skin, sx, sY, rad, tAnim, 'vs');
      } else {
        ctx.fillStyle = THEIRS; ctx.beginPath(); ctx.arc(sx, sY, rad, 0, Math.PI * 2); ctx.fill();
      }
    }

    for (k = 0; k < vs.parts.length; k++) {
      var pt = vs.parts[k];
      ctx.globalAlpha = Math.max(0, 1 - pt.t / pt.life);
      ctx.fillStyle = pt.color; ctx.fillRect(pt.x - 2, SY(pt.y) - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    if (vs.phase === 'countdown') {
      text('GET READY', W / 2, 270, 14, C.fg, 'center');
      text(String(Math.max(1, Math.ceil(vs.cd))), W / 2, 335, 64, C.accent, 'center');
    } else if (vs.phase === 'play' && vs.ball[me].stuck) {
      text('SPACE OR TAP TO LAUNCH', W / 2, 490, 12, C.fg, 'center');
    }

    if (vs.phase === 'over' && vs.over) {
      ctx.fillStyle = 'rgba(12,16,24,0.78)'; ctx.fillRect(0, 52, W, H - 52);
      var won = vs.over.w === me, why = vs.over.why, line;
      if (why === 'LEFT') line = 'YOUR OPPONENT LEFT THE GAME';
      else if (why === 'BREAK') line = won ? 'YOUR BALL GOT PAST THEM' : 'THEIR BALL GOT PAST YOU';
      else line = won ? 'THEY RAN OUT OF LIVES' : 'YOU RAN OUT OF LIVES';
      text(won ? 'YOU WIN' : 'YOU LOSE', W / 2, 230, 34, won ? MINE : THEIRS, 'center');
      text(line, W / 2, 274, 11, C.fg, 'center', 'body');
      text('MATCH TIME ' + fmt(vs.t), W / 2, 298, 11, C.dim, 'center', 'body');
      if (why !== 'LEFT') {
        var waiting = vs.rematch[me];
        btn('rm', waiting ? 'WAITING FOR THEM' + '...'.slice(0, 1 + Math.floor(tAnim * 2) % 3) : 'REMATCH', W / 2, 360, 260, 44, !waiting, vsRematch, C.blue);
        btn('menu', 'MENU', W / 2, 414, 260, 44, false, vsLeave);
      } else {
        btn('menu', 'MENU', W / 2, 360, 260, 44, true, vsLeave, C.blue);
      }
    } else {
      buttons.push({ id: 'leave', x: 70, y: H - 14, w: 140, h: 24, fn: function () { if (tAnim < vsLeaveArm) vsLeave(); else vsLeaveArm = tAnim + 2.2; } });
      text(tAnim < vsLeaveArm ? 'TAP AGAIN TO LEAVE' : 'LEAVE', 8, H - 14, 9, C.dim);
    }
  }

  // Match the canvas resolution to its on-screen size so lines and text stay sharp on phones and retina screens.
  function fit() {
    var cw = cv.clientWidth;
    if (!cw || cw === fitW) return;
    fitW = cw;
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    var pw = Math.max(240, Math.round(cw * dpr));
    cv.width = pw; cv.height = Math.round(pw * H / W);
    try { codeEl.style.fontSize = Math.max(16, cw * 0.075) + 'px'; } catch (e) {}
  }

  function frame(ts) {
    var dt = Math.min(0.033, (ts - last) / 1000 || 0);
    last = ts; tAnim += dt;
    beepCount = 0;
    fit();
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    ctx.lineCap = 'butt';
    buttons.length = 0;
    if (state === 'menu') { updateMenu(dt); drawMenu(); }
    else if (state === 'tree') { drawTree(); }
    else if (state === 'shop') { drawShop(); }
    else if (state === 'vsmenu') { drawVsMenu(); }
    else if (state === 'vshost' || state === 'vsjoin') { drawVsLobby(); }
    else if (state === 'vsgame') { vsUpdate(dt); drawVs(); }
    else { if (state !== 'paused') update(dt); drawGame(); }
    if (codeShown && state !== 'vsjoin') setCodeBox(false);
    if (dirty && tAnim - lastSave > 1) { persist(); lastSave = tAnim; }
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  function moveTree(dx, dy) {
    var cur = NODES[treeSel], best = -1, bs = 1e9;
    for (var i = 0; i < NODES.length; i++) {
      if (i === treeSel) continue;
      var vx = NODES[i].x - cur.x, vy = NODES[i].y - cur.y;
      var along = vx * dx + vy * dy;
      if (along <= 4) continue;
      var perp = dx !== 0 ? Math.abs(vy) : Math.abs(vx);
      var sc = along + 1.5 * perp;
      if (sc < bs) { bs = sc; best = i; }
    }
    if (best >= 0) { treeSel = best; beep(300, 0.03, 'triangle', 0.03); }
  }

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    var left = k === 'ArrowLeft' || k === 'a' || k === 'A';
    var right = k === 'ArrowRight' || k === 'd' || k === 'D';
    var up = k === 'ArrowUp' || k === 'w' || k === 'W';
    var down = k === 'ArrowDown' || k === 's' || k === 'S';
    var go = k === ' ' || k === 'Enter';
    var back = k === 'Escape' || k === 'm' || k === 'M';
    if (e.target && e.target.closest && e.target.closest('#manual')) return;
    if (e.target === codeEl) {
      if (k === 'Enter') { e.preventDefault(); vsJoin(codeEl.value); }
      else if (k === 'Escape') { vsOpenMenu(); }
      return;
    }
    if (left || right || up || down || go || (k === 'Tab' && state === 'shop')) e.preventDefault();
    wake();

    if (state === 'menu') {
      if (up) { menuSel = (menuSel + 4) % 5; hoverId = null; }
      else if (down) { menuSel = (menuSel + 1) % 5; hoverId = null; }
      else if (go && !e.repeat) {
        if (menuSel === 0) playNext(); else if (menuSel === 1) toTree(false);
        else if (menuSel === 2) startHardcore(); else if (menuSel === 3) vsOpenMenu(); else toShop();
      }
      return;
    }
    if (state === 'vsmenu') {
      if (up) { vsSel = (vsSel + 4) % 5; hoverId = null; }
      else if (down) { vsSel = (vsSel + 1) % 5; hoverId = null; }
      else if (go && !e.repeat) { if (vsSel === 0) vsStartAI(); else if (vsSel === 1) vsHostStart(); else if (vsSel === 2) vsOpenJoin(); else if (vsSel === 3) manOpen(); else toMenu(); }
      else if (back && !e.repeat) toMenu();
      return;
    }
    if (state === 'vshost' || state === 'vsjoin') {
      if (k === 'Escape' && !e.repeat) vsOpenMenu();
      return;
    }
    if (state === 'vsgame') {
      if (left) keys.left = true;
      else if (right) keys.right = true;
      else if (go && !e.repeat) vsAction();
      return;
    }
    if (state === 'tree') {
      if (left) moveTree(-1, 0);
      else if (right) moveTree(1, 0);
      else if (up) moveTree(0, -1);
      else if (down) moveTree(0, 1);
      else if (go && !e.repeat) startNode(treeSel);
      else if (back && !e.repeat) toMenu();
      return;
    }
    if (state === 'shop') {
      var items = SHOP[TABS[shopTab].key];
      if (left) shopSel = Math.max(0, shopSel - 1);
      else if (right) shopSel = Math.min(items.length - 1, shopSel + 1);
      else if (up) { if (shopSel - 2 >= 0) shopSel -= 2; }
      else if (down) { if (shopSel + 2 < items.length) shopSel += 2; }
      else if (go && !e.repeat) shopActivate(shopSel);
      else if (k === 'q' || k === 'Q' || (k === 'Tab' && e.shiftKey)) switchTab(-1);
      else if (k === 'e' || k === 'E' || k === 'Tab') switchTab(1);
      else if (back && !e.repeat) shopBack();
      return;
    }

    if (left) keys.left = true;
    else if (right) keys.right = true;
    else if (go && !e.repeat) action();
    else if ((k === 'p' || k === 'P' || k === 'Escape') && !e.repeat) pauseToggle();
    else if ((k === 'm' || k === 'M') && !e.repeat) {
      if (state === 'play') pauseToggle(); else if (state === 'hcdead') toMenu(); else toTree(false);
    }
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });
  window.addEventListener('blur', function () {
    keys.left = keys.right = false;
    flush();
    if (state === 'play') { pausedFrom = 'play'; state = 'paused'; }
  });
  window.addEventListener('pagehide', flush);

  function toGame(e) {
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left - cv.clientLeft) * (W / cv.clientWidth), y: (e.clientY - r.top - cv.clientTop) * (H / cv.clientHeight) };
  }
  function hit(p) {
    for (var i = buttons.length - 1; i >= 0; i--) {
      var b = buttons[i];
      if (b.r) { if (Math.hypot(p.x - b.x, p.y - b.y) <= b.r) return b; }
      else if (Math.abs(p.x - b.x) <= b.w / 2 && Math.abs(p.y - b.y) <= b.h / 2) return b;
    }
    return null;
  }
  cv.addEventListener('pointermove', function (e) {
    var p = toGame(e);
    pointerX = p.x;
    if (state !== 'play' && state !== 'ready') {
      var b = hit(p);
      hoverId = b ? b.id : null;
      if (b && b.id.charAt(0) === 'm' && state === 'menu') menuSel = parseInt(b.id.slice(1), 10);
      if (b && b.id.charAt(0) === 'v' && state === 'vsmenu') vsSel = parseInt(b.id.slice(1), 10);
      if (b && b.id.charAt(0) === 'n' && state === 'tree') treeSel = parseInt(b.id.slice(1), 10);
      if (b && b.id.charAt(0) === 'c' && state === 'shop') shopSel = parseInt(b.id.slice(1), 10);
      cv.style.cursor = b ? 'pointer' : 'default';
    } else { cv.style.cursor = 'default'; }
  });
  cv.addEventListener('pointerdown', function (e) {
    var p = toGame(e);
    pointerX = p.x;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    cv.focus();
    wake();
    downPrevSel = state === 'tree' ? treeSel : (state === 'shop' ? shopSel : -1);
    var b = hit(p);
    if (b) { b.fn(); return; }
    if (state === 'ready' || state === 'paused' || state === 'over' || state === 'cleared' || state === 'hcdead' || state === 'vsgame') action();
  });

  toMenu();
  cv.focus();
  try {
    var hm = /^#([A-Za-z0-9]{4})$/.exec(location.hash || '');
    if (hm) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      state = 'vsjoin';
      setCodeBox(true);
      codeEl.value = hm[1].toUpperCase();
      vsJoin(hm[1]);
    }
  } catch (e) {}
  requestAnimationFrame(frame);
})();
</script>
</body>
